name: Deploy

# Runs only after CI succeeded on main. It does NOT touch your PC: it builds
# and publishes images (sha-<commit>) to GHCR. The Windows server pulls them
# (deploy/deploy.ps1, scheduled every 5 min). No secrets and no self-hosted
# runner are needed - GITHUB_TOKEN is provided automatically.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  publish:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Compute names
        run: |
          echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "SHA=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/vireon-backend:sha-${{ env.SHA }}
            ghcr.io/${{ env.OWNER }}/vireon-backend:latest
          cache-from: type=gha,scope=backend
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/vireon-frontend:sha-${{ env.SHA }}
            ghcr.io/${{ env.OWNER }}/vireon-frontend:latest
          cache-from: type=gha,scope=frontend
      - name: Summary
        run: |
          echo "Published sha-${SHA}. The server deploys it on its next poll (<=5 min)." >> "$GITHUB_STEP_SUMMARY"
