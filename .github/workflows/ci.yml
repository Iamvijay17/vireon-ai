name: CI

on:
  # main: tested on every merge (deploy.yml waits for this run).
  # Other branches: tested once, through their pull request. Triggering on
  # `push` for them too ran every PR commit twice.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Syntax check (all backend sources)
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test -- --ci
        env:
          NODE_ENV: test
          # validate.test.js boots the real config; CI has no .env, so dummy values
          MINIO_ROOT_USER: ci-user
          MINIO_ROOT_PASSWORD: ci-password-1234

  frontend:
    # Workspace install at the repo root: the frontend imports the shared
    # vireon-remotion-templates package (backend/remotion).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Windows-generated lockfile lacks Linux native binaries (npm bug #4828)
      - run: node deploy/install-linux-natives.cjs
      # Errors fail CI. react-hooks/set-state-in-effect is a warning (see
      # frontend/eslint.config.js for why).
      - run: npm run lint --workspace=frontend
      - run: npm test --workspace=frontend
      - run: npm run build --workspace=frontend

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate compose file
        run: |
          cp .env.example .env
          sed -i 's/^MONGODB_URI=.*/MONGODB_URI=mongodb:\/\/ci\/ci/; s/^MINIO_ROOT_USER=.*/MINIO_ROOT_USER=ci/; s/^MINIO_ROOT_PASSWORD=.*/MINIO_ROOT_PASSWORD=cipassword/' .env
          docker compose --profile tailscale --profile quicktunnel config -q
      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build frontend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
