services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ORIGIN: http://localhost,http://localhost:5173
      # LM Studio and the Pinokio F5-TTS server run on the host machine, not
      # in a container - reach them through Docker Desktop's host gateway.
      LM_STUDIO_URL: http://host.docker.internal:1234/v1/chat/completions
      TTS_API_URL: http://host.docker.internal:7860
    ports:
      - "3000:3000"
    volumes:
      - ./backend/jobs:/app/backend/jobs
      - ./backend/logs:/app/backend/logs
      - ./backend/voices:/app/backend/voices
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ["node", "src/workers/videoWorker.js"]
    env_file:
      - backend/.env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LM_STUDIO_URL: http://host.docker.internal:1234/v1/chat/completions
      TTS_API_URL: http://host.docker.internal:7860
    volumes:
      - ./backend/jobs:/app/backend/jobs
      - ./backend/logs:/app/backend/logs
      - ./backend/voices:/app/backend/voices
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  course-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ["node", "src/workers/courseVideoWorker.js"]
    env_file:
      - backend/.env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LM_STUDIO_URL: http://host.docker.internal:1234/v1/chat/completions
      TTS_API_URL: http://host.docker.internal:7860
    volumes:
      - ./backend/jobs:/app/backend/jobs
      - ./backend/logs:/app/backend/logs
      - ./backend/voices:/app/backend/voices
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  redis-data:
