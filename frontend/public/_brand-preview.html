<!doctype html><body style="margin:0;background:#09090B;color:#fff;font:14px sans-serif;padding:20px">
<style>.row{display:flex;gap:24px;align-items:center;margin:10px 0}svg{display:block}.w{background:#fff;padding:10px;display:flex;gap:14px;align-items:center}</style>
<script>
const spark=(cx,cy,r,k=0.16)=>`M${cx} ${cy-r}Q${cx+r*k} ${cy-r*k} ${cx+r} ${cy}Q${cx+r*k} ${cy+r*k} ${cx} ${cy+r}Q${cx-r*k} ${cy+r*k} ${cx-r} ${cy}Q${cx-r*k} ${cy-r*k} ${cx} ${cy-r}Z`;
const cands={
// D: shear-split V; left blade lower, right blade raised; spark in counter
D:`<path d="M4 14H21L31 33V58Z" fill="#7C3AED"/><path d="M60 6H43L33 25V50Z" fill="#A78BFA"/><path d="${spark(32,15,7)}" fill="currentColor"/>`,
// E: bold V, slit through right arm, spark at counter
E:`<path d="M4 8H21L32 31 43 8H60L32 58Z" fill="#7C3AED"/><path d="M60 8 L52 8 L38 34 L42 42Z" fill="#09090B" opacity="0"/><path d="M39 17L50 8H60L45 36Z" fill="#A78BFA"/><path d="${spark(32,14,6)}" fill="currentColor"/>`,
// F: play-wedge V: right arm is a play triangle pointing right-down (shutter), spark
F:`<path d="M4 8H21L33 30V58L4 8Z" fill="#7C3AED"/><path d="M60 8H43L35 22L35 46Z" fill="#A78BFA"/><path d="M38 52L60 8V30Z" fill="#7C3AED" opacity="0"/><path d="${spark(32,13,6.5)}" fill="currentColor"/>`,
};
for(const[k,v] of Object.entries(cands)){document.write(`<div class=row><b>${k}</b>`+[220,96,48,24,16].map(s=>`<svg width=${s} height=${s} viewBox="0 0 64 64" style="color:#fff">${v}</svg>`).join('')+`<div class=w>`+[96,32,16].map(s=>`<svg width=${s} height=${s} viewBox="0 0 64 64" style="color:#09090B">${v}</svg>`).join('')+`</div></div>`)}
</script>
