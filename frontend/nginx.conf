server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 100m;   # matches Cloudflare free-plan upload cap
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /nginx-health { access_log off; return 200 'ok'; }

    # Liveness only ({"status":"ok"}). /ready is internal (Docker healthcheck).
    location = /health {
        proxy_pass http://backend:3000/health;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /voice-samples/ {
        proxy_pass http://backend:3000;
    }

    location /socket.io/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # Generated media: read-only passthrough to the (native) MinIO, object
    # paths in the three Vireon buckets only. Bucket listings, the S3 admin
    # API, the console (:9001) and every write method stay unreachable.
    location ~ ^/media/(vireon-scenes|vireon-video|vireon-cache)/.+ {
        limit_except GET HEAD { deny all; }
        rewrite ^/media/(.*)$ /$1 break;
        proxy_pass http://host.docker.internal:9000;
        proxy_set_header Host $proxy_host;
        proxy_force_ranges on;       # seeking in <video>
        proxy_buffering off;
        proxy_hide_header Set-Cookie;
    }
    location /media/ { return 404; }
}
